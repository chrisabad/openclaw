name: Validate (fork patches)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/validate.yml'

jobs:
  typecheck:
    name: TypeScript typecheck (patched sources)
    runs-on: [self-hosted, agentos-mac]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsgo

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
